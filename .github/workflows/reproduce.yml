name: reproduce-paper
on: [push, pull_request]

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: environment/requirements-analysis.txt
      - run: pip install -r environment/requirements-analysis.txt
      - run: bash reproduce.sh

  corrected-2ns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            environment/requirements-analysis.txt
            reproducibility/environment/requirements-analysis.txt
      - run: pip install -r reproducibility/environment/requirements-analysis.txt
      - run: python reproducibility/scripts/verify.py
      - run: bash reproducibility/run_reproduce.sh
      - uses: actions/upload-artifact@v4
        with:
          name: green-kubo-figures
          if-no-files-found: error
          path: |
            runs/reproducibility-2ns/figures/figureS4_green_kubo_50ps.pdf
            runs/reproducibility-2ns/figures/figureS4_green_kubo_50ps.png
            runs/reproducibility-2ns/figures/figureS5_green_kubo_20ps.pdf
            runs/reproducibility-2ns/figures/figureS5_green_kubo_20ps.png
            runs/reproducibility-2ns/figures/all_24_states.pdf
            runs/reproducibility-2ns/final_2ns_report.pdf
            runs/reproducibility-2ns/FIGURE_CAPTIONS.txt
